<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas</title>
</head>
<body>
    <header>
        <div id="logoHeader">
            <img src="/img/logo.png" alt="Logo Empresa">
        </div>
        <div id="iconosHeader">
            <i class="iconoContacto"></i>
            <i class="iconoCarrito"></i>
        </div>
    </header>
    <main>
        <div class="barraBuscador">

        </div>
        <section class="sectionOfertas">
            <div class="productos">
                <article class="tarjeta">
                    <img src="img/nintendoSwitchOled.png" alt="Nintendo Switch OLED">
                    <div class="datosProducto">
                        <h2>Nintendo Switch OLED</h2>
                        <p class="precio">250 €</p>
                    </div>
                </article>
                <article class="tarjeta">
                    <img src="img/HPEliteBook840G5.png" alt="HP EliteBook 840 G5">
                    <div class="datosProducto">
                        <h2>HP EliteBook 840 G5</h2>
                        <p class="precio">225 €</p>
                    </div>
                </article>
                <article class="tarjeta">
                    <img src="img/PCSobremesaGaming.png" alt="PC Sobremesa Gaming">
                    <div class="datosProducto">
                        <h2>PC Sobremesa Gaming</h2>
                        <p class="precio">225 €</p>
                    </div>
                </article>
                <article class="tarjeta">
                    <img src="img/AirPods.png" alt="AirPods">
                    <div class="datosProducto">
                        <h2>AirPods</h2>
                        <p class="precio">170 €</p>
                    </div>
                </article>
                <article class="tarjeta">
                    <img src="img/Iphone16ProMax.png" alt="Iphone 16 Pro Max">
                    <div class="datosProducto">
                        <h2>Iphone 16 Pro Max</h2>
                        <p class="precio">775 €</p>
                    </div>
                </article>
                <article class="tarjeta">
                    <img src="img/Iphone15.png" alt="Iphone 15">
                    <div class="datosProducto">
                        <h2>Iphone 15</h2>
                        <p class="precio">450 €</p>
                    </div>
                </article>
                <article class="tarjeta">
                    <img src="img/GooglePixel10.png" alt="Google Pixel 10">
                    <div class="datosProducto">
                        <h2>Google Pixel 10</h2>
                        <p class="precio">500 €</p>
                    </div>
                </article>
                <article class="tarjeta">
                    <img src="img/SamsungGalaxyFold6.png" alt="Samsung Galaxy Fold 6">
                    <div class="datosProducto">
                        <h2>Samsung Galaxy Fold 6</h2>
                        <p class="precio">1500 €</p>
                    </div>
                </article>
            </div>
        </section>

    </main>
    <footer>

    </footer>
</body>
</html>
