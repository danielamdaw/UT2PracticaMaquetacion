<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>

        <label for="nombreReg">Nombre:</label>
        <input type="text" name="nombreReg" id="nombreReg" required>
        <br><br>
        <label for="correoReg">Correo:</label>
        <input type="email" name="correoReg" id="correoReg" required>
        <br><br>
        <label for="passReg">Contraseña:</label>
        <input type="password" name="passReg" id="passReg" required>
        <br><br>
        <label for="repPassReg">Confirmar Contraseña:</label>
        <input type="password" name="repPassReg" id="repPassReg" required>
        <br><br>
        <label for="terminos">Aceptar los terminos y condiciones</label>
        <input type="checkbox" name="terminos" id="terminos" required> 
        <br><br>
        <label for="notificaciones">Permitir que le enviemos notificaciones</label>
        <input type="checkbox" name="notificaciones" id="notificaciones">
        <br><br>
        <button type="submit">Resgistrarse</button>


    </form>
</body>
</html>
